<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Door Labyrinth — Maze Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app editor-app">
    <header class="app-header">
      <h1>Maze Editor</h1>
      <p class="level-subtitle"><a href="index.html">&larr; Back to Door Labyrinth</a></p>
    </header>

    <section class="editor-toolbar">
      <label class="editor-field">
        Title
        <input id="maze-title" type="text" value="My Maze" maxlength="40" />
      </label>
      <label class="editor-field">
        Cols
        <input id="grid-cols" type="number" min="5" max="40" value="15" />
      </label>
      <label class="editor-field">
        Rows
        <input id="grid-rows" type="number" min="5" max="30" value="10" />
      </label>
      <button id="resize-btn" type="button">Resize</button>
      <button id="clear-btn" type="button">Clear</button>
    </section>

    <div class="editor-body">
      <aside class="palette" id="palette">
        <h2 class="palette-heading">Structure</h2>
        <div class="palette-group" data-tools="wall,floor,start,exit">
          <button class="palette-btn" data-tool="wall" type="button">Wall</button>
          <button class="palette-btn" data-tool="floor" type="button">Floor</button>
          <button class="palette-btn" data-tool="start" type="button">Start</button>
          <button class="palette-btn" data-tool="exit" type="button">Exit</button>
        </div>

        <h2 class="palette-heading">Simple Mechanics</h2>
        <div class="palette-group" data-tools="oneway,closing">
          <button class="palette-btn" data-tool="oneway" type="button">One-Way</button>
          <button class="palette-btn" data-tool="closing" type="button">Closing</button>
        </div>

        <h2 class="palette-heading">Deep Mechanics</h2>
        <div class="palette-group" data-tools="linked,toggle,trigger">
          <button class="palette-btn" data-tool="linked" type="button">Linked</button>
          <button class="palette-btn" data-tool="toggle" type="button">Toggle</button>
          <button class="palette-btn" data-tool="trigger" type="button">Trigger</button>
        </div>

        <h2 class="palette-heading">Situational</h2>
        <div class="palette-group" data-tools="limited">
          <button class="palette-btn" data-tool="limited" type="button">Limited-Use</button>
        </div>

        <div id="tool-params" class="tool-params"></div>
      </aside>

      <div class="editor-canvas-wrap">
        <div id="editor-canvas" class="editor-canvas"></div>
      </div>
    </div>

    <p id="editor-status" class="editor-status" aria-live="polite"></p>

    <div class="editor-actions">
      <button id="check-solvable-btn" type="button">Check Solvable</button>
      <button id="play-test-btn" type="button">Play Test</button>
      <button id="export-btn" type="button">Export .svg</button>
    </div>

    <p class="hint">Pick a tool, then click a tile to paint it. Placing a new Start/Exit moves the existing one.</p>
  </main>

  <section id="test-overlay" class="overlay" hidden aria-hidden="true">
    <div class="overlay-panel test-panel">
      <h2>Play Test</h2>
      <div class="board-wrap">
        <div id="test-board-container" class="board-container"></div>
        <p id="test-trapped-hint" class="trapped-hint" hidden>No path to the exit right now</p>
      </div>
      <p id="test-status" class="test-status" aria-live="polite"></p>
      <div class="controls">
        <button id="test-undo-btn" type="button">Undo</button>
        <button id="test-restart-btn" type="button">Restart</button>
        <button id="test-back-btn" type="button">Back to Editor</button>
      </div>
      <p class="hint">Arrows / WASD to move</p>
    </div>
  </section>

  <script type="module" src="editor.js"></script>
</body>
</html>
